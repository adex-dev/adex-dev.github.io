<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0F766E;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="rust-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E07050;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C85E3A;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background square with rounded corners -->
  <rect width="200" height="200" rx="28" fill="#0B0F1A"/>

  <!-- === GEOMETRIC ABSTRACT MARK === -->
  <!-- Core: large hexagon outline (navy border) -->
  <polygon points="100,28 158,62 158,130 100,164 42,130 42,62"
           fill="none" stroke="#1F2D45" stroke-width="2"/>

  <!-- Inner filled hexagon — navy -->
  <polygon points="100,44 146,70 146,122 100,148 54,122 54,70"
           fill="#111827"/>

  <!-- Teal triangle — top left -->
  <polygon points="54,70 100,44 100,96"
           fill="url(#teal-grad)" opacity="0.92"/>

  <!-- Rust triangle — top right -->
  <polygon points="100,44 146,70 100,96"
           fill="url(#rust-grad)" opacity="0.92"/>

  <!-- Navy triangle — bottom (creates depth) -->
  <polygon points="54,70 100,96 54,122"
           fill="#161D2F"/>

  <!-- Navy triangle — bottom right -->
  <polygon points="146,70 146,122 100,96"
           fill="#1F2D45"/>

  <!-- Bottom split: teal left, rust right -->
  <polygon points="54,122 100,96 100,148"
           fill="url(#teal-grad)" opacity="0.5"/>
  <polygon points="100,96 146,122 100,148"
           fill="url(#rust-grad)" opacity="0.5"/>

  <!-- Center dot — bright teal -->
  <circle cx="100" cy="96" r="6" fill="#2DD4BF"/>
  <!-- Inner dot -->
  <circle cx="100" cy="96" r="2.5" fill="#0B0F1A"/>

  <!-- Accent lines — top corners -->
  <line x1="42" y1="62" x2="54" y2="70" stroke="#2DD4BF" stroke-width="1.5" opacity="0.6"/>
  <line x1="158" y1="62" x2="146" y2="70" stroke="#C85E3A" stroke-width="1.5" opacity="0.6"/>

  <!-- Outer corner brackets -->
  <!-- Top left -->
  <path d="M 20 48 L 20 20 L 48 20" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top right -->
  <path d="M 180 48 L 180 20 L 152 20" fill="none" stroke="#C85E3A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom left -->
  <path d="M 20 152 L 20 180 L 48 180" fill="none" stroke="#C85E3A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom right -->
  <path d="M 180 152 L 180 180 L 152 180" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
