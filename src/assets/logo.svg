<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="480" height="100">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF"/>
      <stop offset="100%" style="stop-color:#0F766E"/>
    </linearGradient>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E07050"/>
      <stop offset="100%" style="stop-color:#C85E3A"/>
    </linearGradient>
  </defs>
  <rect width="480" height="100" fill="none" rx="12"/>

  <!-- Icon 80x80 centered at y=10 -->
  <g transform="translate(10, 10) scale(0.4)">
    <polygon points="100,28 158,62 158,130 100,164 42,130 42,62" fill="none" stroke="#1F2D45" stroke-width="2"/>
    <polygon points="100,44 146,70 146,122 100,148 54,122 54,70" fill="#111827"/>
    <polygon points="54,70 100,44 100,96" fill="url(#tg)" opacity="0.92"/>
    <polygon points="100,44 146,70 100,96" fill="url(#rg)" opacity="0.92"/>
    <polygon points="54,70 100,96 54,122" fill="#161D2F"/>
    <polygon points="146,70 146,122 100,96" fill="#1F2D45"/>
    <polygon points="54,122 100,96 100,148" fill="url(#tg)" opacity="0.5"/>
    <polygon points="100,96 146,122 100,148" fill="url(#rg)" opacity="0.5"/>
    <circle cx="100" cy="96" r="6" fill="#2DD4BF"/>
    <circle cx="100" cy="96" r="2.5" fill="none"/>
  </g>

  <!-- Divider -->
  <line x1="92" y1="20" x2="92" y2="80" stroke="#1F2D45" stroke-width="1"/>

  <!-- Name -->
  <text x="108" y="42" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="22" font-weight="700" fill="#E8EBF0" letter-spacing="-0.5">Akmad Nudin</text>
  <!-- Role -->
  <text x="108" y="64" font-family="Courier New,monospace" font-size="12" fill="#8B98B0" letter-spacing="1">FULL STACK ENGINEER</text>
  <!-- Teal accent under role -->
  <line x1="108" y1="70" x2="260" y2="70" stroke="#2DD4BF" stroke-width="1" opacity="0.3"/>
  <!-- Rust/Axum badge -->
  <rect x="108" y="76" width="88" height="14" rx="3" fill="rgba(200,94,58,0.15)" stroke="rgba(200,94,58,0.3)" stroke-width="0.8"/>
  <text x="114" y="87" font-family="Courier New,monospace" font-size="9" fill="#C85E3A" letter-spacing="0.5">Rust + Axum</text>
</svg>